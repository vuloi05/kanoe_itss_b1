<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed-variant": "#603d3e",
              "outline": "#74777d",
              "secondary-container": "#fdddb9",
              "primary-fixed-dim": "#adc7f7",
              "on-secondary-fixed-variant": "#584329",
              "outline-variant": "#c4c6cd",
              "surface": "#f9f9f7",
              "error": "#ba1a1a",
              "surface-dim": "#dadad8",
              "inverse-primary": "#adc7f7",
              "on-tertiary-fixed": "#2f1314",
              "tertiary": "#3f2122",
              "on-surface": "#1a1c1b",
              "background": "#f9f9f7",
              "on-secondary-container": "#786044",
              "on-error-container": "#93000a",
              "error-container": "#ffdad6",
              "on-secondary": "#ffffff",
              "on-primary-container": "#91abd9",
              "secondary-fixed-dim": "#e0c29f",
              "on-primary": "#ffffff",
              "surface-tint": "#455f88",
              "surface-container": "#eeeeec",
              "primary": "#09294f",
              "inverse-surface": "#2f3130",
              "primary-fixed": "#d6e3ff",
              "secondary": "#715a3e",
              "surface-variant": "#e2e3e1",
              "tertiary-container": "#583637",
              "inverse-on-surface": "#f1f1ef",
              "on-surface-variant": "#44474d",
              "on-primary-fixed-variant": "#2d476f",
              "tertiary-fixed-dim": "#ecbbba",
              "primary-container": "#243f67",
              "surface-container-high": "#e8e8e6",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f4f4f2",
              "on-primary-fixed": "#001b3c",
              "on-tertiary": "#ffffff",
              "on-secondary-fixed": "#281803",
              "on-background": "#1a1c1b",
              "surface-bright": "#f9f9f7",
              "surface-container-highest": "#e2e3e1",
              "secondary-fixed": "#fdddb9",
              "on-tertiary-container": "#ce9f9f",
              "tertiary-fixed": "#ffdad9",
              "on-error": "#ffffff"
            },
            fontFamily: {
              "headline": ["Be Vietnam Pro"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.5rem", "xl": "1rem", "2xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-pattern {
            background-image: radial-gradient(circle at 2px 2px, #e2e3e1 1px, transparent 0);
            background-size: 32px 32px;
        }
        /* Custom scrollbar to ensure zero scrolling feel */
        body::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-secondary-container selection:text-on-secondary-container h-screen overflow-hidden flex flex-col">
<!-- Header / Logo Area -->
<header class="w-full py-8 px-12 shrink-0">
<div class="max-w-7xl mx-auto flex justify-center md:justify-start">
<span class="text-2xl font-bold text-primary tracking-tighter font-headline uppercase">VietImmerse</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-6 bg-pattern pb-12">
<!-- Center Content Container -->
<div class="max-w-6xl w-full">
<!-- Hero Heading -->
<div class="text-center mb-12">
<h1 class="text-4xl md:text-5xl font-headline font-extrabold text-primary tracking-tight leading-tight">
                    Bắt đầu hành trình <span class="text-secondary italic font-normal">văn hóa của bạn.</span>
</h1>
</div>
<!-- Choice Cards -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch h-full">
<!-- Learner Card -->
<div class="group relative overflow-hidden bg-surface-container-lowest rounded-2xl p-8 transition-all duration-300 hover:shadow-2xl hover:shadow-primary/5 border border-outline-variant/30 flex flex-col justify-between">
<div class="absolute -top-12 -right-12 w-48 h-48 bg-primary/5 rounded-full blur-3xl"></div>
<div class="relative z-10">
<div class="w-14 h-14 bg-primary text-white rounded-xl flex items-center justify-center mb-6 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h2 class="text-2xl font-headline font-bold text-primary mb-1">Học tiếng Việt</h2>
<p class="text-xs font-semibold text-secondary mb-4 tracking-widest uppercase">ベトナム語を学ぶ (Learner)</p>
<p class="text-on-surface-variant text-sm mb-8 italic opacity-80">Luyện nghe nói giọng Hà Nội chuẩn cùng đối tác bản xứ.</p>
</div>
<button class="relative z-10 w-full py-4 bg-primary text-on-primary rounded-xl font-headline font-bold tracking-wide hover:bg-primary/90 transition-all flex items-center justify-center gap-2">
                        Bắt đầu học ngay
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
<!-- Partner Card -->
<div class="group relative overflow-hidden bg-surface-container-lowest rounded-2xl p-8 transition-all duration-300 hover:shadow-2xl hover:shadow-secondary/5 border border-outline-variant/30 flex flex-col justify-between">
<div class="absolute -top-12 -right-12 w-48 h-48 bg-secondary/5 rounded-full blur-3xl"></div>
<div class="relative z-10">
<div class="w-14 h-14 bg-secondary text-white rounded-xl flex items-center justify-center mb-6 shadow-lg shadow-secondary/20">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">groups</span>
</div>
<h2 class="text-2xl font-headline font-bold text-primary mb-1">Trở thành đối tác</h2>
<p class="text-xs font-semibold text-secondary mb-4 tracking-widest uppercase">パートナーになる (Partner)</p>
<p class="text-on-surface-variant text-sm mb-8 italic opacity-80">Chia sẻ ngôn ngữ quê hương và tạo thu nhập linh hoạt.</p>
</div>
<button class="relative z-10 w-full py-4 bg-secondary text-on-primary rounded-xl font-headline font-bold tracking-wide hover:bg-secondary/90 transition-all flex items-center justify-center gap-2">
                        Đăng ký ngay
                        <span class="material-symbols-outlined text-sm">handshake</span>
</button>
</div>
</div>
</div>
<!-- Trust Indicator -->
</main>
<!-- Simple Footer -->
</body></html>
