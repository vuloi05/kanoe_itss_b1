services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: VietImmerse_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ASP.NET Core
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      # Database
      - DATABASE_CONNECTION_STRING=Host=db;Port=5432;Database=VietImmerse_db;Username=postgres;Password=admin
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=VietImmerse_db;Username=postgres;Password=admin
      # JWT Authentication
      - JWT_SECRET=V13t1mm3rs3_S3cur3_K3y_2026!@#$$%^&*_256b1t_Str0ng
      - JWT_ISSUER=VietImmerse
      - JWT_AUDIENCE=VietImmerseApp
      - JWT_EXPIRY_HOURS=24

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

volumes:
  postgres_data:
