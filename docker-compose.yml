services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: .env

  frontend:
    build:
      context: ./frontend
      args:
        # Next.js bakes NEXT_PUBLIC_* at build time, must pass as build arg
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    env_file: .env
