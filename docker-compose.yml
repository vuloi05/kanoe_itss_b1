services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: VietImmerse_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=VietImmerse_db;Username=postgres;Password=admin

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
