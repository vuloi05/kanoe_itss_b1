<body class="bg-background font-body text-on-surface min-h-screen flex items-center justify-center p-0 md:p-6 overflow-x-hidden">

<img alt="Hanoi Old Quarter at dusk" class="absolute inset-0 w-full h-full object-cover opacity-60 mix-blend-luminosity" data-alt="Cinematic wide shot of Hanoi's Old Quarter at dusk with traditional architectural shutters, warm street lighting, and deep indigo sky" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBA3X9tc0W9muriyslIGeDXbDGAyqGpA3jAfBB5MBQ1e-t3dtZGaQZ0y-bBClmtoxbgCP3wd1brb7GRpgp-f38iSAwIok_Idd4aL6Zbp6XAuvOtilb7ud48Ffekwl9AS8aYPWPsvUa9RyPUsc8REo6XD8bb9CJ1woQ1_oob6MdLo33sIARWUTtAXZU39CoNW0HvEOvWk6C61BE-8P435qJVmNPI_bIBzLN4_fh7KKmCmA8Lc5eAQfqz_8jYoQZCpB-qcIXifbcNlhs"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/80 via-primary/20 to-transparent"></div>

<h1 class="font-headline font-extrabold text-3xl tracking-tight text-white mb-2">VietImmerse</h1>
<div class="h-1 w-12 bg-secondary rounded-full"></div>
</div>
<div class="space-y-6">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-secondary text-4xl" data-icon="auto_awesome">auto_awesome</span>
<p class="font-headline font-medium text-lg leading-snug">Hành trình ngôn ngữ<br/><span class="font-light opacity-80">言語の旅</span></p>
</div>
<p class="text-on-primary/70 max-w-xs leading-relaxed text-sm">
                        Khám phá vẻ đẹp của phương ngữ miền Bắc thông qua trải nghiệm học tập tinh tế.
                    </p>
</div>
</div>
<!-- Lotus Decorative Motif -->
<div class="absolute bottom-[-10%] right-[-10%] opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[300px]" style="font-variation-settings: 'FILL' 1;">filter_vintage</span>
</div>
</section>
<!-- Right Side: Reset Password Form -->
<section class="w-full md:w-7/12 flex flex-col justify-center items-center p-8 md:p-16 lotus-bg">
<div class="w-full max-w-md">
<!-- Header Branding Mobile -->
<div class="md:hidden mb-12 text-center">
<h1 class="font-headline font-extrabold text-2xl tracking-tight text-primary">VietImmerse</h1>
</div>
<!-- Form Header -->
<header class="mb-10 text-left">
<h2 class="font-headline font-bold text-2xl text-primary tracking-tight mb-2">
                        Thiết lập lại mật khẩu
                    </h2>
<p class="text-secondary font-medium text-sm">
                        新しいパスワードを設定する
                    </p>
</header>
<form class="space-y-8">
<!-- Password Field 1 -->
<div class="relative group">
<div class="flex items-center border-b border-outline-variant group-focus-within:border-primary transition-all duration-300 py-2">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary mr-3 transition-colors">lock</span>
<input class="block w-full appearance-none bg-transparent border-none focus:ring-0 text-on-surface text-base py-1 px-0 font-body placeholder-transparent" id="new_password" placeholder=" " type="password"/>
<label class="absolute left-9 top-3 text-outline transition-all duration-300 pointer-events-none text-sm group-focus-within:text-xs" for="new_password">
                                Mật khẩu mới / 新しいパスワード
                            </label>
<button class="text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Password Field 2 -->
<div class="relative group">
<div class="flex items-center border-b border-outline-variant group-focus-within:border-primary transition-all duration-300 py-2">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary mr-3 transition-colors">verified_user</span>
<input class="block w-full appearance-none bg-transparent border-none focus:ring-0 text-on-surface text-base py-1 px-0 font-body placeholder-transparent" id="confirm_password" placeholder=" " type="password"/>
<label class="absolute left-9 top-3 text-outline transition-all duration-300 pointer-events-none text-sm group-focus-within:text-xs" for="confirm_password">
                                Xác nhận mật khẩu mới / 新しいパスワードの確認
                            </label>
<button class="text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="pt-6">
<button class="w-full bg-primary text-white py-4 px-6 rounded-xl font-headline font-bold text-base hover:bg-primary-container transition-all duration-300 shadow-[0_12px_32px_-4px_rgba(9,41,79,0.1)] active:scale-[0.98] flex items-center justify-center gap-3" type="submit">
<span>Cập nhật mật khẩu / パスワードを更新する</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Back to Login Link -->
<div class="pt-4 text-center">
<a class="inline-flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors duration-300 font-body text-sm" href="#">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
<span class="border-b border-transparent hover:border-primary pb-0.5">Quay lại Đăng nhập / ログインに戻る</span>
</a>
</div>

<p class="text-[10px] text-outline uppercase tracking-widest font-bold">Hanoi • Tokyo</p>
